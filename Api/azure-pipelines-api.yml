trigger:
  paths:
    include:
      - 'Api/*'
      - 'docker/Api*'
      - 'devops/Api*'

name: $(Build.DefinitionName).1.0$(Rev:.r)
pool: Kubernetes Agents

parameters:
- name: 'application'
  type: string
  default: 'api-integration'
- name: 'acr'
  type: string
  default: 'ACR CapitalOnTap'
- name: 'repo_name'
  type: string
  default: containerisation.poc.api.ado
- name: 'dockerfile_location'
  type: string
  default: 'docker/'
- name: 'tags'
  type: string
  default: "1.0.0.$(build.buildid)"
- name: 'arguments'
  type: string
  default: ''

resources:
  containers:
    - container: dotnetsdk
      image: mcr.microsoft.com/dotnet/sdk:6.0
    
    # Does not work 
    - container: octocli
      image: octopusdeploy/octo
      mapDockerSocket: false

stages:
- stage: DockerCompose
  displayName: Running Docker Compose
  variables:
    APPLICATION: "${{ parameters.application }}"
    AZURE_CLIENT_ID: fa45590d-ded7-4edd-a4ef-7bb8858e1234 # in keeper under "ci-poc (ado test pipeline)"
    AZURE_TENANT_ID: c6bd9460-ef43-4cf1-878e-6416537f0495
  jobs:
  - job: DockerCompose
    continueOnError: true
    steps:
    - script: |
        export AZURE_CLIENT_ID=$(AZURE_CLIENT_ID)
        export AZURE_TENANT_ID=$(AZURE_TENANT_ID)
        export AZURE_CLIENT_SECRET=$(AZURE_CLIENT_SECRET) # Pipeline Variable
        chmod +x ./sftp/config/incron-setup.sh
        docker compose -f $(System.DefaultWorkingDirectory)/docker-compose.tests.yml up $APPLICATION --exit-code-from $APPLICATION
      displayName: Docker Compose

# Need to template this step. DevOps have a already templated this we will need to add context param and update the docker file location parameters
- stage: DockerBuildPush
  jobs:
    - job: Build_Docker
      displayName: Docker build
      steps:
      - checkout: self
      - task: Docker@2
        displayName: Login to ACR
        inputs:
          command: login
          containerRegistry: ${{ parameters.acr }}
      - task: Docker@2
        displayName: Build
        inputs:
          containerRegistry: '${{ parameters.acr }}'
          repository: '${{ parameters.repo_name }}'
          command: 'build'
          Dockerfile: '${{ parameters.dockerfile_location }}/Api.Dockerfile'
          buildContext: '$(System.DefaultWorkingDirectory)'
          tags: '${{ parameters.tags }}'
          arguments: '${{ parameters.arguments }}'
      - task: Docker@2
        displayName: Push
        inputs:
          command: push
          containerRegistry: ${{ parameters.acr }}
          repository: ${{ parameters.repo_name }}
          tags: ${{ parameters.tags }}
      - task: Docker@2
        displayName: Logout of ACR
        inputs:
          command: logout
          containerRegistry: ${{ parameters.acr }}

- stage: OctoBuildPush
  displayName: OctoBuildPush
  jobs:
    - job: OctoBuildDirectory
      steps:
        - script: |
            mkdir -p ./deployment
            cp ./devops/Api/kubernetes/*.yaml ./deployment
            cp ./Api/appsettings.json ./deployment
            cp ./Api/keyvaults.json ./deployment
            sed -i 's/$IMAGETAG/containerisation.poc.api-ado:${{ parameters.tags }}/g' ./deployment/deployment.yaml
            ls deployment
            pwd
          displayName: CreateOctoDir

# Installing OctoCli should be included in the build image
        - script: |
            apt update && apt install --no-install-recommends gnupg curl ca-certificates apt-transport-https && \
            curl -sSfL https://apt.octopus.com/public.key | apt-key add - && \
            sh -c "echo deb https://apt.octopus.com/ stable main > /etc/apt/sources.list.d/octopus.com.list" && \
            apt update && apt install octopuscli
          displayName: InstallOctoCli
        
        - script: |
           octo pack --id="containerisation.poc.api" --format="zip" --version="${{ parameters.tags }}" --basePath="./deployment" --outFolder="./deployment"
           octo push --package="./deployment/containerisation.poc.api.${{ parameters.tags }}.zip" --server="https://octopus.capitalontap.com" --apiKey=$(OctopusApiKey)
           octo create-release --server="https://octopus.capitalontap.com" --apiKey=$(OctopusApiKey) --project="$(OctoProjectName)" --enableservicemessages --version="${{ parameters.tags }}" --channel="$(OctopusChannel)" --packageVersion="${{ parameters.tags }}"
          displayName: PackPushOcto
      variables:
        OctopusChannel: Default
        OctoProjectName: "Containerisation.Api"

