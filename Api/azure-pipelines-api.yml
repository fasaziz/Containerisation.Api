trigger:
  paths:
    include:
      - 'Api/*'

name: $(Build.DefinitionName).1.0$(Rev:.r)
pool: Kubernetes Agents

parameters:
- name: 'acr'
  type: string
  default: 'ACR CapitalOnTap'
- name: 'repo_name'
  type: string
  default: containerisation.poc.api.ado
- name: 'dockerfile_location'
  type: string
  default: 'docker/'
- name: 'tags'
  type: string
  default: "1.0.0.$(build.buildid)"
- name: 'arguments'
  type: string
  default: ''

resources:
  containers:
    - container: dotnetsdk
      image: mcr.microsoft.com/dotnet/sdk:6.0
    
    - container: octocli
      image: octopusdeploy/octo

    # - container: gitversion
    #   image: capitalontap.azurecr.io/library/gittools/gitversion:6.0.0-alpine.3.16-6.0
    #   endpoint: ACR CapitalOnTap

stages:
- stage: DockerCompose
  displayName: Running Docker Compose
  variables:
    APPLICATION: "api-integration"
    AZURE_CLIENT_ID: fa45590d-ded7-4edd-a4ef-7bb8858e1234 # in keeper under "ci-poc (ado test pipeline)"
    AZURE_TENANT_ID: c6bd9460-ef43-4cf1-878e-6416537f0495
  jobs:
  - job: DockerCompose
    continueOnError: true
    steps:
    - script: |
        export AZURE_CLIENT_ID=$(AZURE_CLIENT_ID)
        export AZURE_TENANT_ID=$(AZURE_TENANT_ID)
        export AZURE_CLIENT_SECRET=$(AZURE_CLIENT_SECRET) # Pipeline Variable
        chmod +x ./sftp/config/incron-setup.sh
        docker compose -f $(System.DefaultWorkingDirectory)/docker-compose.tests.yml up $APPLICATION --exit-code-from $APPLICATION
      displayName: Docker Compose

- stage: DockerBuildPush
  jobs:
    - job: Build_Docker
      displayName: Docker build
      steps:
      - checkout: self
      - task: Docker@2
        displayName: Login to ACR
        inputs:
          command: login
          containerRegistry: ${{ parameters.acr }}
      - task: Docker@2
        displayName: Build
        inputs:
          containerRegistry: '${{ parameters.acr }}'
          repository: '${{ parameters.repo_name }}'
          command: 'build'
          Dockerfile: '${{ parameters.dockerfile_location }}/Api.Dockerfile'
          buildContext: '$(System.DefaultWorkingDirectory)'
          tags: '${{ parameters.tags }}'
          arguments: '${{ parameters.arguments }}'
      - task: Docker@2
        displayName: Push
        inputs:
          command: push
          containerRegistry: ${{ parameters.acr }}
          repository: ${{ parameters.repo_name }}
          tags: ${{ parameters.tags }}
      - task: Docker@2
        displayName: Logout of ACR
        inputs:
          command: logout
          containerRegistry: ${{ parameters.acr }}

- stage: BuildOctoDirectory
  displayName: BuildOctoDirectory
  jobs:
    - job: BuildDirectory
      steps:
        - script: |
            mkdir -p ./deployment
            cp ./devops/Api/kubernetes/*.yaml ./deployment
            cp ./Api/appsettings.json ./deployment
            cp ./Api/keyvaults.json ./deployment
            sed -i 's/$IMAGETAG/containerisation.poc.api-ado:1.0.0.${{ parameters.tags }}/g' ./deployment/deployment.yaml

- stage: PushToOcto
  displayName: PushToOcto
  variables:
    OctopusChannel: Default
    OctoProjectName: "Containerisation.Api"
  jobs:
  - job: PushToOcto
    steps:
    - script: |
        octo pack --id="containerisation.poc.api" --format="zip" --version="1.0.0.${{ parameters.tags }}" --basePath="./deployment" --outFolder="./deployment"
        octo push --package="./deployment/containerisation.poc.api.1.0.0.${{ parameters.tags }}.zip" --server="https://octopus.capitalontap.com" --apiKey="$OctopusApiKey"
        octo create-release --server="https://octopus.capitalontap.com" --apiKey="$OctopusApiKey" --project="$OctoProjectName" --enableservicemessages --version="1.0.0.${{ parameters.tags }}" --channel="$OctopusChannel" --packageVersion="1.0.0.${{ parameters.tags }}"
      displayName: PushToOcto
      target: octocli

